<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login @ Register</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="loader">
      <div class="spinner"></div>
    </div>

    <div class="bg-overlay"></div>

    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">
          <div class="login-container">
            <h3 class="typing mb-3 text-center">Welcome Back</h3>

            <div id="formMessage"></div>

            <form id="loginForm">
              <input
                id="email"
                type="email"
                class="form-control mb-2"
                placeholder="Email"
                required
              />

              <div class="password-box">
                <input
                  id="password"
                  type="password"
                  class="form-control mb-2"
                  placeholder="Password"
                  required
                />
                <span id="togglePass">👁️</span>
              </div>

              <button class="btn btn-glow w-100">Login</button>
            </form>

            <hr />

            <button
              class="btn btn-outline-glow w-100 mb-2"
              data-bs-toggle="collapse"
              data-bs-target="#signupForm"
            >
              Create Account
            </button>

            <div class="collapse" id="signupForm">
              <form id="signupCollapseForm">
                <input
                  type="text"
                  class="form-control mb-2"
                  placeholder="Full Name"
                  required
                />
                <input
                  type="email"
                  class="form-control mb-2"
                  placeholder="Email"
                  required
                />

                <div class="password-box">
                  <input
                    type="password"
                    class="form-control mb-2"
                    placeholder="Password"
                    required
                  />
                </div>

                <input
                  type="password"
                  class="form-control mb-2"
                  placeholder="Confirm Password"
                  required
                />

                <button class="btn btn-glow-green w-100">Register</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
